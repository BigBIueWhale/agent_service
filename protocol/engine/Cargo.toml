[package]
name = "runtime_contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Unlicense"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"

[dev-dependencies]
num-rational = "=0.4.2"
jsonschema = { version = "=0.55.1", default-features = false }

[build-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
